[versions]
dokka = "2.2.0"
# Build toolchain. AGP 9 refuses `com.android.library` / `com.android.application` together with the
# Kotlin Multiplatform plugin, so the two library modules use `com.android.kotlin.multiplatform.library`
# and the showcase is a plain Android application with AGP's built-in Kotlin. AGP 9.5 needs Gradle 9.6+.
agp = "9.5.1"
# What the published AARs ask a consumer to compile against. androidx.compose 1.12 (pulled by Compose
# Multiplatform 1.12) already requires compileSdk 37, so this moves no consumer floor further.
android-compileSdk = "37"
android-minSdk = "28"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-testExt = "1.3.0"
# Compose Multiplatform is a CONSUMER FLOOR, not just a build tool: its version leaks into every
# consumer's runtime classpath through the published metadata. 1.12.0 is the oldest 1.12 release and
# the line the sibling design-system library builds on, so an app on any 1.12.x resolves its own
# patch and is never forced up by this library.
composeMultiplatform = "1.12.0"
junit = "4.13.2"
kotlin = "2.4.21"
# JetBrains publishes Material 3 for Compose Multiplatform on its own version line. 1.9.0 is the
# newest STABLE release (1.10 through 1.13 are alpha/beta only), and it is the version the design
# system depends on. chart-compose exposes material3 types (ColorScheme) in its API, so this is an
# `api` dependency and therefore lands in consumers' POMs: it must never be a pre-release.
material3 = "1.9.0"
robolectric = "4.17"
roborazzi = "1.77.0"
jmhGradlePlugin = "0.7.3"
ktlint = "14.2.0"
# Vanniktech Maven Publish owns the fiddly parts of KMP publishing (sources/javadoc jars on every
# target publication including the Kotlin metadata one), GPG signing, and the Central Portal bundle
# upload. Config is written against the 0.34.0 API - re-check publishToMavenCentral() when bumping.
mavenPublish = "0.37.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTest-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
jmh = { id = "me.champeau.jmh", version.ref = "jmhGradlePlugin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }