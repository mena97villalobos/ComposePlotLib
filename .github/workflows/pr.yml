name: PR checks

# Every pull request, whatever its base: stacked PRs target the branch of the PR below them, and they
# need the same checks as a PR against main.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSEPLOTLIB_VERSION: debug

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Binary API check
        run: ./gradlew apiCheck

      - name: chart-core KMP purity
        run: ./gradlew :chart-core:verifyChartCorePurity

      - name: Unit tests
        run: >
          ./gradlew
          :chart-core:jvmTest
          :chart-core:testAndroidHostTest
          :chart-compose:testAndroidHostTest

      - name: Roborazzi verification
        run: ./gradlew :samples:android-showcase:verifyRoborazziDebug

      - name: Assemble Android showcase (debug)
        run: ./gradlew :samples:android-showcase:assembleDebug

  ios:
    # The klib targets (iOS and Wasm) are declared on macOS only (see chart-core/build.gradle.kts), so this
    # job is where a commonMain change that breaks them is caught at PR time, not at release, and the only
    # PR job that checks the klib ABI dump.
    runs-on: macos-latest
    env:
      COMPOSEPLOTLIB_FORCE_IOS_TARGETS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 17

      # apiCheck below also checks the Android ABI, which needs the SDK.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Compile iOS targets (device + simulator)
        run: >
          ./gradlew
          :chart-core:compileKotlinIosArm64
          :chart-core:compileKotlinIosSimulatorArm64
          :chart-compose:compileKotlinIosArm64
          :chart-compose:compileKotlinIosSimulatorArm64

      - name: Compile Wasm targets
        run: >
          ./gradlew
          :chart-core:compileKotlinWasmJs
          :chart-compose:compileKotlinWasmJs

      - name: chart-core tests on Wasm (Node.js)
        run: ./gradlew :chart-core:wasmJsNodeTest

      - name: Binary API check (with the klib dump)
        run: ./gradlew apiCheck
