name: PR checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSEPLOTLIB_VERSION: debug

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: >
          ./gradlew
          :chart-core:jvmTest
          :chart-core:testDebugUnitTest
          :chart-compose:testDebugUnitTest

      - name: Roborazzi verification
        run: ./gradlew :samples:android-showcase:verifyRoborazziDebug

      - name: Assemble composeApp (debug)
        run: ./gradlew :composeApp:assembleDebug
