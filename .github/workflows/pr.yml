name: PR checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSEPLOTLIB_VERSION: debug

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Binary API check
        run: ./gradlew apiCheck

      - name: chart-core KMP purity
        run: ./gradlew :chart-core:verifyChartCorePurity

      - name: Unit tests
        run: >
          ./gradlew
          :chart-core:jvmTest
          :chart-core:testDebugUnitTest
          :chart-compose:testDebugUnitTest

      - name: Roborazzi verification
        run: ./gradlew :samples:android-showcase:verifyRoborazziDebug

      - name: Assemble Android showcase (debug)
        run: ./gradlew :samples:android-showcase:assembleDebug

  ios:
    # Compile the Kotlin/Native iOS targets so a commonMain change that breaks iOS
    # is caught at PR time, not at release (release.yml is the only other place iOS builds).
    runs-on: macos-14
    env:
      COMPOSEPLOTLIB_FORCE_IOS_TARGETS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile iOS targets (device + simulator)
        run: >
          ./gradlew
          :chart-core:compileKotlinIosArm64
          :chart-core:compileKotlinIosSimulatorArm64
          :chart-compose:compileKotlinIosArm64
          :chart-compose:compileKotlinIosSimulatorArm64
