name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so advisories that land after a merge still get caught.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSEPLOTLIB_VERSION: debug

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze java-kotlin
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL needs to observe a real compilation of the Kotlin sources, and `build-mode: manual`
      # means an empty build is a failed analysis, not a fast one. On any PR that does not touch
      # Kotlin the build cache serves both compile tasks FROM-CACHE, so the build "succeeds" having
      # compiled nothing and CodeQL aborts with "could not process any code written in Java/Kotlin".
      # --no-build-cache stops the remote cache answering; --rerun-tasks stops the restored local
      # state marking the tasks UP-TO-DATE. The task graph here is ~19 tasks, so this is cheap.
      - name: Build
        run: >
          ./gradlew --no-build-cache --rerun-tasks
          :chart-core:compileDebugKotlinAndroid
          :chart-compose:compileDebugKotlinAndroid

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
