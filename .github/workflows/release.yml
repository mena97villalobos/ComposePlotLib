name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag format and ancestry on main
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc1 (leading v, semver core)."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit must be reachable from origin/main."
            exit 1
          fi

  build-and-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set library version from tag
        run: echo "COMPOSEPLOTLIB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: ./gradlew ktlintCheck

      # Publishing must not be able to pass gates a PR would have failed.
      - name: Public API check
        run: ./gradlew apiCheck

      - name: chart-core KMP purity
        run: ./gradlew :chart-core:verifyChartCorePurity

      - name: Unit tests
        run: >
          ./gradlew
          :chart-core:jvmTest
          :chart-core:testDebugUnitTest
          :chart-compose:testDebugUnitTest

      - name: Roborazzi verification
        run: ./gradlew :samples:android-showcase:verifyRoborazziDebug

      - name: Assemble Android showcase (debug)
        run: ./gradlew :samples:android-showcase:assembleDebug

      - name: Dokka HTML
        run: ./gradlew dokkaGenerateHtml

      - name: Publish Android and JVM to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >
          ./gradlew
          :chart-core:publishAndroidReleasePublicationToGitHubPackagesRepository
          :chart-core:publishJvmPublicationToGitHubPackagesRepository
          :chart-compose:publishAndroidReleasePublicationToGitHubPackagesRepository

      - name: Zip Dokka site
        run: (cd build/dokka/html && zip -r "$GITHUB_WORKSPACE/dokka-html.zip" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dokka-html.zip
          generate_release_notes: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  publish-ios:
    needs: build-and-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set library version from tag
        run: echo "COMPOSEPLOTLIB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Compile before publishing: this job runs on macOS, so it is the only place a
      # Kotlin/Native break would surface before artifacts go out.
      - name: Compile iOS targets
        run: >
          ./gradlew
          :chart-core:compileKotlinIosArm64
          :chart-core:compileKotlinIosSimulatorArm64
          :chart-compose:compileKotlinIosArm64
          :chart-compose:compileKotlinIosSimulatorArm64

      - name: Publish iOS and KMP metadata to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >
          ./gradlew
          :chart-core:publishIosArm64PublicationToGitHubPackagesRepository
          :chart-core:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          :chart-core:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :chart-compose:publishIosArm64PublicationToGitHubPackagesRepository
          :chart-compose:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          :chart-compose:publishKotlinMultiplatformPublicationToGitHubPackagesRepository

  # Central Portal validates and releases a deployment as ONE bundle, so every target (JVM, Android,
  # both iOS targets and the Kotlin metadata module) must be built and uploaded in a single run on
  # macOS. It cannot be split across Linux + macOS jobs the way GitHub Packages publishing is above:
  # a bundle missing the iOS modules would publish a broken -kotlinMultiplatform root module.
  #
  # Gated on the PUBLISH_TO_MAVEN_CENTRAL repository variable so releases keep working until the
  # Central Portal account, namespace verification and signing secrets are all in place.
  # See docs/github-ci-packages-and-pages.md for the one-time setup.
  publish-maven-central:
    if: ${{ vars.PUBLISH_TO_MAVEN_CENTRAL == 'true' }}
    needs: [build-and-release, publish-ios]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set library version from tag
        run: echo "COMPOSEPLOTLIB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven Central (Central Portal)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew
          :chart-core:publishToMavenCentral
          :chart-compose:publishToMavenCentral

  notify-bom:
    needs: [build-and-release, publish-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Notify BOM repository
        run: |
          curl -X POST https://api.github.com/repos/mena97villalobos/ComposeLibsBom/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.BOM_REPO_TOKEN }}" \
            -d '{
              "event_type": "library-released",
              "client_payload": {
                "artifact": "ComposePlotLib",
                "version": "'${{ github.ref_name }}'"
              }
            }'

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
