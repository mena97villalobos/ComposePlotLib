name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag format and ancestry on main
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc1 (leading v, semver core)."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit must be reachable from origin/main."
            exit 1
          fi

  build-and-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set library version from tag
        run: echo "COMPOSEPLOTLIB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: >
          ./gradlew
          :chart-core:jvmTest
          :chart-core:testDebugUnitTest
          :chart-compose:testDebugUnitTest

      - name: Roborazzi verification
        run: ./gradlew :samples:android-showcase:verifyRoborazziDebug

      - name: Assemble composeApp (debug)
        run: ./gradlew :composeApp:assembleDebug

      - name: Dokka HTML
        run: ./gradlew dokkaGenerateHtml

      - name: Publish Android and JVM to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >
          ./gradlew
          :chart-core:publishAndroidReleasePublicationToGitHubPackagesRepository
          :chart-core:publishJvmPublicationToGitHubPackagesRepository
          :chart-compose:publishAndroidReleasePublicationToGitHubPackagesRepository

      - name: Zip Dokka site
        run: (cd build/dokka/html && zip -r "$GITHUB_WORKSPACE/dokka-html.zip" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dokka-html.zip
          generate_release_notes: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html

  publish-ios:
    needs: build-and-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set library version from tag
        run: echo "COMPOSEPLOTLIB_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish iOS and KMP metadata to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >
          ./gradlew
          :chart-core:publishIosArm64PublicationToGitHubPackagesRepository
          :chart-core:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          :chart-core:publishKotlinMultiplatformPublicationToGitHubPackagesRepository
          :chart-compose:publishIosArm64PublicationToGitHubPackagesRepository
          :chart-compose:publishIosSimulatorArm64PublicationToGitHubPackagesRepository
          :chart-compose:publishKotlinMultiplatformPublicationToGitHubPackagesRepository

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
