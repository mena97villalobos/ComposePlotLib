name: Sample App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSEPLOTLIB_VERSION: debug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Assemble android-showcase (debug)
        run: ./gradlew :samples:android-showcase:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-showcase-debug
          path: samples/android-showcase/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
