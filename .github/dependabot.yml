version: 2

# Monthly, and batched into a single PR per ecosystem. Dependabot cannot combine ecosystems into
# one PR, so the floor is two PRs per month: one for Gradle, one for GitHub Actions. Everything
# within each ecosystem — direct and transitive, version and security updates, majors included —
# lands in that one PR rather than one PR per dependency.
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      all-gradle-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
      all-gradle-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    groups:
      all-github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
      all-github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
