// Compose compiler stability configuration for ComposePlotLib.
//
// chart-core is a pure Kotlin Multiplatform module (Android + iOS) and is forbidden from
// importing androidx.compose.runtime, so its immutable spec/model/value types cannot carry
// @Immutable/@Stable annotations directly. They ARE effectively immutable (data classes /
// value types), so we tell the Compose compiler to treat them as stable here instead. This
// lets charts skip recomposition on structurally-equal specs without polluting chart-core
// with a Compose dependency.
//
// Pattern syntax: `**` matches the package and all nested classes (e.g. sealed subclasses).

// Immutable chart specifications and the value/model types they hold.
com.mena97villalobos.composeplotlib.core.spec.**
com.mena97villalobos.composeplotlib.core.model.**

// Viewport, selection, and geometry value types passed into / held by the composables.
com.mena97villalobos.composeplotlib.core.viewport.**
com.mena97villalobos.composeplotlib.core.selection.**
com.mena97villalobos.composeplotlib.core.geometry.**
com.mena97villalobos.composeplotlib.core.range.**
com.mena97villalobos.composeplotlib.core.domain.**
